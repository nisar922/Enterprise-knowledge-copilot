<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Knowledge Copilot</title>
  <link rel="stylesheet" href="/ui/css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <div class="chat-layout">
    <aside class="chat-sidebar">
      <button class="btn" id="new-chat" style="width:100%" type="button">+ New chat</button>
      <ul class="conv-list" id="conv-list"></ul>
    </aside>
    <section class="chat-main">
      <div class="messages" id="messages"></div>
      <form class="chat-form" id="chat-form">
        <textarea id="question" rows="1" maxlength="1000" required
          placeholder="Ask a question about your documents... (Enter to send, Shift+Enter for new line)"></textarea>
        <button class="btn" id="send-btn" type="submit">Send</button>
      </form>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="/ui/javascript/api.js"></script>
  <script src="/ui/javascript/chat.js"></script>
</body>
</html>
