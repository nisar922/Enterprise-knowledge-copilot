<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Knowledge Copilot</title>
  <link rel="stylesheet" href="/ui/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Knowledge Copilot</h1>
    <p class="muted">AI Document Intelligence Platform</p>
    <div class="tabs">
      <button class="tab active" id="tab-login" type="button">Login</button>
      <button class="tab" id="tab-register" type="button">Register</button>
    </div>
    <form id="login-form">
      <label for="login-username">Username</label>
      <input type="text" id="login-username" required autocomplete="username">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" required autocomplete="current-password">
      <button class="btn" style="width:100%;margin-top:1rem" type="submit">Login</button>
    </form>
    <form id="register-form" class="hidden">
      <label for="reg-username">Username</label>
      <input type="text" id="reg-username" required minlength="3" maxlength="50" autocomplete="username">
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" required autocomplete="email">
      <label for="reg-password">Password (min 8 characters)</label>
      <input type="password" id="reg-password" required minlength="8" maxlength="72" autocomplete="new-password">
      <button class="btn" style="width:100%;margin-top:1rem" type="submit">Create account</button>
    </form>
    <p class="form-error" id="error"></p>
  </main>
  <script src="/ui/javascript/api.js"></script>
  <script src="/ui/javascript/login.js"></script>
</body>
</html>
