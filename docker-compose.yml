services:
  db:
    image: pgvector/pgvector:pg16
    container_name: copilot_db
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot123}
      POSTGRES_DB: copilot_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copilot_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://copilot:${POSTGRES_PASSWORD:-copilot123}@db:5432/copilot_db
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/project/backend/uploads
      - hf_cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  uploads_data:
  hf_cache: